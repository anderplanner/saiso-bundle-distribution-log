name: append-distribution

# Triggered desde labstest via:
#   POST /repos/anderplanner/saiso-bundle-distribution-log/dispatches
#   {"event_type":"saiso-bundle-distribution","client_payload":{...}}
#
# Append directo a log.jsonl en main via Contents API. El ruleset
# 'protect-main-append-only' enforza:
#   - required_signatures (Contents API genera commits server-side firmados)
#   - required_linear_history (no merges)
#   - non_fast_forward (no rewriting)
#   - deletion (no deletes)
# Solo el flujo append es posible — apto para transparency log.

on:
  repository_dispatch:
    types: [saiso-bundle-distribution]

permissions:
  contents: write

concurrency:
  group: append-distribution
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Validate payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          for k in version channel bundle_sha256 criticality distributed_to_tenants signed_by timestamp_utc; do
            v=$(echo "$PAYLOAD" | jq -r --arg k "$k" 'if has($k) then "ok" else "missing" end')
            if [ "$v" = "missing" ]; then
              echo "::error::missing client_payload field: $k"
              exit 1
            fi
          done
          CRIT=$(echo "$PAYLOAD" | jq -r '.criticality')
          if [ "$CRIT" != "normal" ] && [ "$CRIT" != "critical" ]; then
            echo "::error::invalid criticality: $CRIT"
            exit 1
          fi
          IS_LIST=$(echo "$PAYLOAD" | jq -r '.distributed_to_tenants | type')
          if [ "$IS_LIST" != "array" ]; then
            echo "::error::distributed_to_tenants must be a list (got $IS_LIST)"
            exit 1
          fi
          VERSION=$(echo "$PAYLOAD" | jq -r '.version')
          CHANNEL=$(echo "$PAYLOAD" | jq -r '.channel')
          echo "payload validated: version=$VERSION channel=$CHANNEL"

      - name: Append JSONL line on main via Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          # 1) Construir línea JSONL determinística (claves ordenadas).
          LINE=$(echo "$PAYLOAD" | jq -cS .)
          echo "appending: $LINE"

          VERSION=$(echo "$PAYLOAD" | jq -r '.version')
          SHA7=$(echo "$PAYLOAD" | jq -r '.bundle_sha256[0:7]')
          MSG="append: bundle ${VERSION} (sha7=${SHA7})"

          # Reintentos por carrera con otros dispatch (concurrency:group ya
          # serializa, pero ante 409 SHA conflict reintentamos leyendo de nuevo).
          for attempt in 1 2 3 4 5; do
            PREV=$(curl -sS "${AUTH[@]}" "${API}/contents/log.jsonl?ref=main")
            PREV_TYPE=$(echo "$PREV" | jq -r 'type')
            PREV_SHA=""
            PREV_CONTENT=""
            if [ "$PREV_TYPE" = "object" ]; then
              PREV_SHA=$(echo "$PREV" | jq -r 'if has("sha") then .sha else "" end')
              if [ -n "$PREV_SHA" ]; then
                PREV_CONTENT=$(echo "$PREV" | jq -r '.content' | base64 -d)
              fi
            fi
            NEW_CONTENT=$(printf '%s%s\n' "$PREV_CONTENT" "$LINE")
            NEW_B64=$(printf '%s' "$NEW_CONTENT" | base64 -w0)

            PUT_BODY=$(jq -nc \
              --arg msg "$MSG" \
              --arg content "$NEW_B64" \
              --arg prev "$PREV_SHA" \
              'if $prev == "" then {message:$msg, content:$content, branch:"main"}
               else {message:$msg, content:$content, branch:"main", sha:$prev} end')

            HTTP=$(curl -sS "${AUTH[@]}" -o /tmp/put.out -w "%{http_code}" \
              -X PUT "${API}/contents/log.jsonl" -d "$PUT_BODY")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              echo "appended on attempt $attempt"
              jq -r '.commit.sha' /tmp/put.out
              exit 0
            fi
            echo "attempt $attempt failed rc=$HTTP body=$(cat /tmp/put.out)"
            sleep $(( attempt * 3 ))
          done
          echo "::error::append failed after retries"
          exit 1
